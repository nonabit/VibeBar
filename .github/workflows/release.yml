name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 Tag（例如 v1.0.1）；留空表示使用当前 ref"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 mise 工具链
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: 解析发布标签
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -n "${GITHUB_REF_NAME:-}" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout "tags/$TAG"
          else
            echo "错误：workflow_dispatch 触发时请传入 tag（如 v1.0.1）" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 选择 Swift 6.2+ 的 Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APPS="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r || true)"
          if [[ -z "$XCODE_APPS" ]]; then
            echo "错误：Runner 上没有发现可用的 Xcode 安装。" >&2
            exit 1
          fi

          FOUND=""
          while IFS= read -r APP; do
            [[ -z "$APP" ]] && continue
            DEV_DIR="$APP/Contents/Developer"
            sudo xcode-select -s "$DEV_DIR"
            SWIFT_LINE="$(xcrun swift --version | head -n 1)"
            echo "检查 $APP -> $SWIFT_LINE"

            if echo "$SWIFT_LINE" | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)'; then
              FOUND="$APP"
              break
            fi
          done <<< "$XCODE_APPS"

          if [[ -z "$FOUND" ]]; then
            echo "错误：未找到 Swift 6.2+ 的 Xcode。当前依赖 SweetCookieKit@0.4.0 需要 Swift 6.2+。" >&2
            exit 1
          fi

          echo "已选择 Xcode: $FOUND"
          xcodebuild -version
          xcrun swift --version

      - name: 构建 SwiftPM App Bundle
        shell: bash
        run: |
          set -euo pipefail
          mise run app:release

      - name: 打包发布产物
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          RAW_TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${RAW_TAG#v}"
          DMG_NAME="VibeBar-${VERSION}-macOS-universal.dmg"
          SHA_NAME="VibeBar-${VERSION}-macOS-universal.sha256.txt"
          APP_PATH="dist/VibeBar.app"

          ./scripts/create_drag_dmg.sh "$APP_PATH" "dist/$DMG_NAME" "VibeBar"

          shasum -a 256 "dist/$DMG_NAME" > "dist/$SHA_NAME"

          echo "dmg=dist/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$SHA_NAME" >> "$GITHUB_OUTPUT"

      - name: 生成发布说明（Changelog）
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          COMPARE_BASE="${{ github.server_url }}/${{ github.repository }}/compare"

          {
            echo "## 更新日志"
            echo
            if [[ -n "$PREV_TAG" ]]; then
              echo "- 范围：\`$PREV_TAG...$TAG\`"
              echo "- 对比：[\`$PREV_TAG...$TAG\`]($COMPARE_BASE/$PREV_TAG...$TAG)"
              echo
              echo "### 提交记录"
              git log --no-merges --pretty='- %s (%h)' "$PREV_TAG..$TAG"
            else
              echo "- 首个版本发布"
              echo
              echo "### 提交记录"
              git log --no-merges --pretty='- %s (%h)' "$TAG"
            fi
          } > "$NOTES_FILE"

          echo "notes=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="VibeBar $TAG"
          NOTES_FILE="${{ steps.notes.outputs.notes }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
            gh release upload "$TAG" \
              "${{ steps.package.outputs.dmg }}" \
              "${{ steps.package.outputs.sha }}" \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.package.outputs.dmg }}" \
              "${{ steps.package.outputs.sha }}" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi
